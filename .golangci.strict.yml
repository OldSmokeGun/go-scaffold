version: "2"

# ------------------------------------------------------------------------------
# Run
# ------------------------------------------------------------------------------

run:
  # Maximum analysis time.
  timeout: 5m

  # Do not modify go.mod/go.sum while running lint.
  modules-download-mode: readonly

  # Check test files as well.
  tests: true


# ------------------------------------------------------------------------------
# Linters
# ------------------------------------------------------------------------------

linters:
  # Do not rely on the default linter set.
  # Explicitly define the project's quality gate.
  default: none

  enable:
    # --------------------------------------------------------------------------
    # Uber Go Style Guide core
    # --------------------------------------------------------------------------

    # Ensure errors are always handled.
    - errcheck

    # Catch common Go mistakes.
    - govet

    # Static analysis.
    - staticcheck

    # Modern replacement for golint.
    - revive

    # --------------------------------------------------------------------------
    # Error handling
    # --------------------------------------------------------------------------

    # Enforce idiomatic error handling and wrapping.
    - errorlint

    # Detect nil errors that should not be returned.
    - nilerr

    # Detect suspicious nil returns.
    - nilnil

    # Require errors from external packages to be wrapped with context.
    - wrapcheck

    # --------------------------------------------------------------------------
    # Correctness
    # --------------------------------------------------------------------------

    # Detect HTTP response bodies that are not closed.
    - bodyclose

    # Check context propagation.
    - contextcheck

    # Detect inappropriate context usage.
    - noctx

    # Detect missing switch cases.
    - exhaustive

    # --------------------------------------------------------------------------
    # Code quality
    # --------------------------------------------------------------------------

    # Additional Go correctness/style checks.
    - gocritic

    # Detect unnecessary conversions.
    - unconvert

    # Detect assignments whose result is never used.
    - wastedassign

    # Detect suspicious unused parameters.
    - unparam

    # Detect zero-value slice allocation mistakes.
    - makezero

    # Detect unnecessary initializations.
    - ineffassign

    # --------------------------------------------------------------------------
    # Security
    # --------------------------------------------------------------------------

    - gosec

    # Detect bidirectional Unicode control characters.
    - bidichk

    # --------------------------------------------------------------------------
    # Maintainability
    # --------------------------------------------------------------------------

    # Detect duplicated code.
    - dupl

    # Detect duplicated constants.
    - goconst

    # Detect excessive cyclomatic complexity.
    - gocyclo

    # Detect excessive cognitive complexity.
    - gocognit

    # Detect deeply nested if statements.
    - nestif

    # Detect overly long functions.
    - funlen

    # --------------------------------------------------------------------------
    # Naming / documentation / style
    # --------------------------------------------------------------------------

    # Detect spelling mistakes.
    - misspell

    # Require comments to end with punctuation where appropriate.
    - godot

    # Detect naked returns.
    - nakedret

    # Detect whitespace problems.
    - whitespace

    # Detect unnecessary blank lines before returns.
    - nlreturn

    # Detect TODO/FIXME style comments.
    - godox

    # --------------------------------------------------------------------------
    # Modern Go
    # --------------------------------------------------------------------------

    # Suggest modern Go language/library constructs.
    - modernize

    # Prefer standard library constants/variables where appropriate.
    - usestdlibvars

    # Detect inefficient fmt/sprintf usage.
    - perfsprint

    # --------------------------------------------------------------------------
    # API / interface design
    # --------------------------------------------------------------------------

    # Detect interface parameters that should not be used.
    - iface

    # Detect overly large interfaces.
    - interfacebloat

    # --------------------------------------------------------------------------
    # Logging
    # --------------------------------------------------------------------------

    - loggercheck

    # --------------------------------------------------------------------------
    # Tests
    # --------------------------------------------------------------------------

    # Detect unsafe parallel test patterns.
    - tparallel

    # --------------------------------------------------------------------------
    # Suppression quality
    # --------------------------------------------------------------------------

    # Ensure //nolint directives are explicit and justified.
    - nolintlint


  # --------------------------------------------------------------------------
  # Linter settings
  # --------------------------------------------------------------------------

  settings:

    # ------------------------------------------------------------------------
    # errcheck
    # ------------------------------------------------------------------------

    errcheck:
      check-type-assertions: true
      check-blank: true


    # ------------------------------------------------------------------------
    # govet
    # ------------------------------------------------------------------------

    govet:
      enable:
        - shadow


    # ------------------------------------------------------------------------
    # revive
    # ------------------------------------------------------------------------

    revive:
      severity: warning


    # ------------------------------------------------------------------------
    # gocyclo
    # ------------------------------------------------------------------------

    gocyclo:
      # Uber's guide emphasizes keeping code simple and readable.
      min-complexity: 15


    # ------------------------------------------------------------------------
    # gocognit
    # ------------------------------------------------------------------------

    gocognit:
      min-complexity: 20


    # ------------------------------------------------------------------------
    # funlen
    # ------------------------------------------------------------------------

    funlen:
      # Keep functions reasonably small.
      lines: 100
      statements: 50

      # Comments should not artificially increase function length.
      ignore-comments: true


    # ------------------------------------------------------------------------
    # nestif
    # ------------------------------------------------------------------------

    nestif:
      min-complexity: 4


    # ------------------------------------------------------------------------
    # dupl
    # ------------------------------------------------------------------------

    dupl:
      threshold: 150


    # ------------------------------------------------------------------------
    # goconst
    # ------------------------------------------------------------------------

    goconst:
      min-len: 3
      min-occurrences: 3
      numbers: true


    # ------------------------------------------------------------------------
    # gosec
    # ------------------------------------------------------------------------

    gosec:
      confidence: medium


    # ------------------------------------------------------------------------
    # wrapcheck
    # ------------------------------------------------------------------------

    wrapcheck:
      # Require contextual wrapping for errors returned from other packages.
      # This follows the project's error-handling policy.
      ignore-package-globs: [ ]


    # ------------------------------------------------------------------------
    # nolintlint
    # ------------------------------------------------------------------------

    nolintlint:
      require-explanation: true
      require-specific: true


  # --------------------------------------------------------------------------
  # Exclusions
  # --------------------------------------------------------------------------

  exclusions:
    # Respect standard generated-code markers.
    generated: strict

    # Report unused exclusion rules.
    warn-unused: true

    # Do not use broad exclusion presets.
    presets: [ ]

    # No global exclusions.
    rules: [ ]


# ------------------------------------------------------------------------------
# Formatters
# ------------------------------------------------------------------------------

formatters:
  # Uber explicitly recommends goimports.
  #
  # In golangci-lint v2, goimports is a formatter rather than a linter.
  enable:
    - goimports


# ------------------------------------------------------------------------------
# Issues
# ------------------------------------------------------------------------------

issues:
  # Never truncate issues from a linter.
  max-issues-per-linter: 0

  # Never hide repeated issues.
  max-same-issues: 0
