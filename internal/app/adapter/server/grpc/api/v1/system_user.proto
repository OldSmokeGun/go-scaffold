syntax = "proto3";

package internal.app.adapter.grpc.api.v1.system_user;

option go_package = "go-scaffold/internal/app/adapter/grpc/api/v1;v1";

import "v1/system_role.proto";

service SystemUser {
  rpc Create (SystemUserCreateRequest) returns (SystemUserCreateResponse) {};
  rpc Update (SystemUserUpdateRequest) returns (SystemUserUpdateResponse) {};
  rpc Delete (SystemUserDeleteRequest) returns (SystemUserDeleteResponse) {};
  rpc Detail (SystemUserDetailRequest) returns (SystemUserInfo) {};
  rpc List (SystemUserListRequest) returns (SystemUserListResponse) {};
  rpc AssignRoles (SystemUserAssignRolesRequest) returns (SystemUserAssignRolesResponse) {};
  rpc GetRoles (SystemUserGetRolesRequest) returns (SystemUserGetRolesResponse) {};
}

message SystemUserInfo {
  int64 id = 1; // @gotags: json:"id"
  string username = 2; // @gotags: json:"username"
  string nickname = 3; // @gotags: json:"nickname"
  string phone = 4; // @gotags: json:"phone"
}

message SystemUserCreateRequest {
  string username = 1; // @gotags: json:"username"
  string password = 2; // @gotags: json:"password"
  string nickname = 3; // @gotags: json:"nickname"
  string phone = 4; // @gotags: json:"phone"
}
message SystemUserCreateResponse {}

message SystemUserUpdateRequest {
  int64 id = 1; // @gotags: json:"id"
  string username = 2; // @gotags: json:"username"
  string password = 3; // @gotags: json:"password"
  string nickname = 4; // @gotags: json:"nickname"
  string phone = 5; // @gotags: json:"phone"
}
message SystemUserUpdateResponse {}

message SystemUserDeleteRequest {
  int64 id = 1; // @gotags: json:"id"
}
message SystemUserDeleteResponse {}

message SystemUserDetailRequest {
  int64 id = 1; // @gotags: json:"id"
}

message SystemUserListRequest {
  string keyword = 1; // @gotags: json:"keyword"
}
message SystemUserListResponse {
  repeated SystemUserInfo items = 1; // @gotags: json:"items"
}

message SystemUserAssignRolesRequest {
  int64 user = 1; // @gotags: json:"user"
  repeated int64 roles = 2; // @gotags: json:"roles"
}
message SystemUserAssignRolesResponse {}

message SystemUserGetRolesRequest {
  int64 id = 1; // @gotags: json:"id"
}
message SystemUserGetRolesResponse {
  repeated system_role.SystemRoleInfo items = 1; // @gotags: json:"items"
}
