syntax = "proto3";

package internal.app.adapter.grpc.api.v1.system_role;

option go_package = "go-scaffold/internal/app/adapter/grpc/api/v1;v1";

import "v1/system_permission.proto";

service SystemRole {
  rpc Create (SystemRoleCreateRequest) returns (SystemRoleCreateResponse) {};
  rpc Update (SystemRoleUpdateRequest) returns (SystemRoleUpdateResponse) {};
  rpc Delete (SystemRoleDeleteRequest) returns (SystemRoleDeleteResponse) {};
  rpc Detail (SystemRoleDetailRequest) returns (SystemRoleInfo) {};
  rpc List (SystemRoleListRequest) returns (SystemRoleListResponse) {};
  rpc GrantPermissions (SystemRoleGrantPermissionsRequest) returns (SystemRoleGrantPermissionsResponse) {};
  rpc GetPermissions (SystemRoleGetPermissionsRequest) returns (SystemRoleGetPermissionsResponse) {};
}

message SystemRoleInfo {
  int64 id = 1; // @gotags: json:"id"
  string name = 2; // @gotags: json:"name"
}

message SystemRoleCreateRequest {
  string name = 1; // @gotags: json:"name"
}
message SystemRoleCreateResponse {}

message SystemRoleUpdateRequest {
  int64 id = 1; // @gotags: json:"id"
  string name = 2; // @gotags: json:"name"
}
message SystemRoleUpdateResponse {}

message SystemRoleDeleteRequest {
  int64 id = 1; // @gotags: json:"id"
}
message SystemRoleDeleteResponse {}

message SystemRoleDetailRequest {
  int64 id = 1; // @gotags: json:"id"
}

message SystemRoleListRequest {
  string keyword = 1; // @gotags: json:"keyword"
}
message SystemRoleListResponse {
  repeated SystemRoleInfo items = 1; // @gotags: json:"items"
}

message SystemRoleGrantPermissionsRequest {
  int64 role = 1; // @gotags: json:"role"
  repeated int64 permissions = 2; // @gotags: json:"permissions"
}
message SystemRoleGrantPermissionsResponse {}

message SystemRoleGetPermissionsRequest {
  int64 id = 1; // @gotags: json:"id"
}
message SystemRoleGetPermissionsResponse {
  repeated system_permission.SystemPermissionInfo items = 1; // @gotags: json:"items"
}
